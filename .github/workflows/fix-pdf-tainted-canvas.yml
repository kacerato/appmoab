name: One-time fix PDF tainted canvas

on:
  push:
    branches:
      - fix/pdf-tainted-canvas
    paths:
      - .github/workflows/fix-pdf-tainted-canvas.yml

permissions:
  contents: write

jobs:
  patch-build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-tainted-canvas
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install safe DOM renderer
        working-directory: frontend
        run: npm install html2canvas@1.4.1 --save

      - name: Replace foreignObject renderer
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path("frontend/src/app/(dashboard)/hydrometers/page.tsx")
          source = page.read_text(encoding="utf-8")

          pattern = re.compile(
              r"const renderStickerSlot = async \(slot: HTMLElement, stylesheet: string\) => \{.*?\n\};\n\nconst createStickerPdf",
              re.DOTALL,
          )

          replacement = r'''const renderStickerSlot = async (slot: HTMLElement) => {
            const bounds = slot.getBoundingClientRect();
            if (!bounds.width || !bounds.height) {
              throw new Error('A etiqueta não possui dimensões válidas para gerar o PDF.');
            }

            const { default: html2canvas } = await import('html2canvas');
            return html2canvas(slot, {
              backgroundColor: '#ffffff',
              scale: STICKER_RENDER_SIZE_PX / bounds.width,
              useCORS: true,
              allowTaint: false,
              logging: false,
              width: bounds.width,
              height: bounds.height,
              windowWidth: slot.ownerDocument.documentElement.scrollWidth,
              windowHeight: slot.ownerDocument.documentElement.scrollHeight,
            });
          };

          const createStickerPdf'''

          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit("Expected foreignObject renderer was not found")

          old_stylesheet = '''    const stylesheet = Array.from(frameDocument.querySelectorAll('style'))
                .map(style => style.textContent || '')
                .join('\\n');
              const slots = Array.from(frameDocument.querySelectorAll<HTMLElement>('.sticker-slot'));'''
          new_stylesheet = "    const slots = Array.from(frameDocument.querySelectorAll<HTMLElement>('.sticker-slot'));"
          if old_stylesheet not in updated:
              raise SystemExit("Expected stylesheet extraction block was not found")
          updated = updated.replace(old_stylesheet, new_stylesheet, 1)

          old_call = "      renderedStickers.push(await renderStickerSlot(slot, stylesheet));"
          new_call = "      renderedStickers.push(await renderStickerSlot(slot));"
          if old_call not in updated:
              raise SystemExit("Expected renderStickerSlot call was not found")
          updated = updated.replace(old_call, new_call, 1)

          page.write_text(updated, encoding="utf-8")

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Commit tested correction
        run: |
          rm .github/workflows/fix-pdf-tainted-canvas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json "frontend/src/app/(dashboard)/hydrometers/page.tsx" .github/workflows/fix-pdf-tainted-canvas.yml
          git commit -m "fix: renderizar etiquetas sem contaminar o canvas"
          git push origin HEAD:fix/pdf-tainted-canvas
