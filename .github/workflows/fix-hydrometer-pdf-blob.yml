name: One-time PDF Blob typing fix

on:
  push:
    branches:
      - feat/hydrometer-qr-sticker
    paths:
      - .github/workflows/fix-hydrometer-pdf-blob.yml

permissions:
  contents: write

jobs:
  patch-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/hydrometer-qr-sticker
          fetch-depth: 0

      - name: Fix BlobPart typing and remove one-time workflow
        shell: python
        run: |
          from pathlib import Path

          page = Path("frontend/src/app/(dashboard)/hydrometers/page.tsx")
          source = page.read_text(encoding="utf-8")

          old = """  const chunks: Uint8Array[] = [];
          const offsets = new Array<number>(maxObjectId + 1).fill(0);
          let byteOffset = 0;

          const push = (bytes: Uint8Array) => {
            chunks.push(bytes);
            byteOffset += bytes.length;
          };"""

          new = """  const chunks: ArrayBuffer[] = [];
          const offsets = new Array<number>(maxObjectId + 1).fill(0);
          let byteOffset = 0;

          const push = (bytes: Uint8Array) => {
            const buffer = new ArrayBuffer(bytes.byteLength);
            new Uint8Array(buffer).set(bytes);
            chunks.push(buffer);
            byteOffset += bytes.byteLength;
          };"""

          if old not in source:
            raise SystemExit("Expected PDF chunk builder snippet was not found")

          page.write_text(source.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/fix-hydrometer-pdf-blob.yml").unlink()

      - name: Commit corrected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "frontend/src/app/(dashboard)/hydrometers/page.tsx" .github/workflows/fix-hydrometer-pdf-blob.yml
          git commit -m "fix: use ArrayBuffer chunks when building PDF Blob"
          git push origin HEAD:feat/hydrometer-qr-sticker
